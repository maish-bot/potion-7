<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTIONS — Private Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Syne:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: url('scalp-main.jpg') center/cover no-repeat;
        position: relative;
        font-family: 'Inter', sans-serif;
      }

      /* Dark background veil */
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1;
      }

      /* Split container: Image left, Form right */
      .pass-card {
        position: relative;
        z-index: 2;
        background-color: #0b0b0b;
        border: 1px solid #222;
        max-width: 850px;
        width: 90%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      }

      .card-image-side {
        background: url('scalp-main.jpg') center/cover no-repeat;
        min-height: 400px;
      }

      .card-form-side {
        padding: 3rem 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .brand-logo {
        max-width: 140px;
        height: auto;
        margin: 0 auto 1rem auto; /* CENTERED LOGO */
        display: block;
      }

      .brand-sub {
        font-size: 0.8rem;
        color: #ff9900;
        margin-bottom: 1.5rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 700;
      }

      .pass-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .pass-input {
        width: 100%;
        padding: 0.8rem 1rem;
        background: #181818;
        border: 1px solid #333;
        color: #fff;
        font-size: 0.85rem;
        text-align: center;
        box-sizing: border-box;
      }

      .pass-input::placeholder {
        color: #777;
      }

      .pass-btn {
        width: 100%;
        padding: 0.8rem 1rem;
        background: #ffffff;
        color: #000000;
        border: none;
        font-weight: 700;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.85rem;
        transition: opacity 0.2s ease;
      }

      .pass-btn:hover {
        opacity: 0.9;
      }

      .pass-btn.alt {
        background: transparent;
        color: #fff;
        border: 1px solid #333;
      }

      .divider {
        width: 100%;
        display: flex;
        align-items: center;
        text-align: center;
        margin: 1.25rem 0;
        color: #444;
        font-size: 0.75rem;
      }

      .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #222;
      }

      .divider span {
        padding: 0 0.5rem;
      }

      .error-msg {
        color: #ff4d4d;
        font-size: 0.75rem;
        margin: 0;
        display: none;
      }

      /* Mobile responsiveness */
      @media (max-width: 650px) {
        .pass-card {
          grid-template-columns: 1fr;
        }
        .card-image-side {
          min-height: 200px;
        }
      }
    </style>
</head>
<body>

    <div class="pass-card">
      
      <!-- LEFT SIDE: LIFESTYLE IMAGE -->
      <div class="card-image-side"></div>

      <!-- RIGHT SIDE: FORM CONTENT -->
      <div class="card-form-side">
        <!-- MODE 1: EMAIL CAPTURE (DEFAULT) -->
        <div id="waitlist-mode" style="width: 100%;">
          <img src="potions-logo.png" alt="POTIONS Logo" class="brand-logo">
          <p class="brand-sub">- sign up for password upon release -</p>

          <form action="YOUR_GOOGLE_FORM_URL_HERE" method="POST" target="_blank" class="pass-form">
            <input type="email" name="entry.YOUR_ENTRY_ID" placeholder="EMAIL ADDRESS" required class="pass-input">
            <button type="submit" class="pass-btn">JOIN WAITLIST</button>
          </form>

          <div class="divider"><span>OR</span></div>

          <button type="button" id="btn-show-pass" class="pass-btn alt">ENTER PASSWORD</button>
        </div>

        <!-- MODE 2: PASSWORD ACCESS -->
        <div id="password-mode" style="display: none; width: 100%;">
          <img src="potions-logo_2.jpg" alt="POTIONS Logo" class="brand-logo">
          <p class="brand-sub">ENTER PASSWORD TO UNLOCK</p>

          <form id="pass-form" class="pass-form">
            <input type="password" id="pass-input" placeholder="ENTER PASSWORD" required class="pass-input">
            <p id="pass-error" class="error-msg">INVALID PASSWORD</p>
            <button type="submit" class="pass-btn">ENTER SITE</button>
          </form>

          <div class="divider"><span>OR</span></div>

          <button type="button" id="btn-show-waitlist" class="pass-btn alt">BACK TO WAITLIST</button>
        </div>
      </div>

    </div>

    <script>
      const SITE_PASSWORD = "POTIONS2026";

      const waitlistMode = document.getElementById('waitlist-mode');
      const passMode     = document.getElementById('password-mode');
      const btnShowPass  = document.getElementById('btn-show-pass');
      const btnShowWait  = document.getElementById('btn-show-waitlist');
      const passForm     = document.getElementById('pass-form');
      const passInput    = document.getElementById('pass-input');
      const passError    = document.getElementById('pass-error');

      btnShowPass.addEventListener('click', () => {
        waitlistMode.style.display = 'none';
        passMode.style.display = 'block';
      });

      btnShowWait.addEventListener('click', () => {
        passMode.style.display = 'none';
        waitlistMode.style.display = 'block';
      });

      passForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (passInput.value === SITE_PASSWORD) {
          sessionStorage.setItem('siteUnlocked', 'true');
          window.location.href = 'index.html';
        } else {
          passError.style.display = 'block';
        }
      });
    </script>
</body>
</html>
